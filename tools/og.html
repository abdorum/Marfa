<!doctype html>
<!-- The link preview (public/og.png, 1200×630): what a chat app shows when the
     site's link is shared. Open in a browser at 1200×630 and screenshot it, or
     run: node tools/og.mjs (headless Edge or Chrome). No college name on it:
     the project is not the college's. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
@font-face { font-family: 'Plex Arabic'; font-weight: 300; src: url('../node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-300-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plex Arabic'; font-weight: 500; src: url('../node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plex'; font-weight: 300; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-300-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plex'; font-weight: 500; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plex Mono'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: 'Plex', 'Plex Arabic', sans-serif; color: #3D3A32;
  background: repeating-linear-gradient(0deg, rgb(61 58 50 / 5%) 0 1px, transparent 1px 3px), linear-gradient(180deg, #CDC8B1, #C2BDA4);
  display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; padding: 0 72px;
}
.words { display: grid; gap: 22px; }
.mark { display: flex; align-items: center; gap: 18px; }
.mark img { width: 96px; height: 96px; box-shadow: 6px 6px 0 rgb(61 58 50 / 16%); }
.mark span { font: 400 20px 'Plex Mono', monospace; color: #524F48; letter-spacing: .04em; direction: ltr; }
h1 { font: 300 76px/1.12 'Plex Arabic', sans-serif; padding-bottom: 16px; border-bottom: 2px solid #3D3A32; box-shadow: 0 7px 0 -5px rgb(61 58 50 / 30%); }
p { font: 300 31px/1.6 'Plex Arabic', sans-serif; color: #3D3A32; }
small { font: 500 21px 'Plex Arabic', sans-serif; color: #524F48; }
.cards { position: relative; height: 470px; }
.card { position: absolute; width: 400px; background: #DAD5BF; box-shadow: 9px 9px 0 rgb(61 58 50 / 16%); }
.bar { background: #57544A; color: #E4DFCA; display: flex; justify-content: space-between; padding: 12px 20px; font: 500 22px 'Plex Arabic', sans-serif; }
.bar i { font: 400 18px 'Plex Mono', monospace; font-style: normal; opacity: .85; }
.c1 { top: 0; right: 0; }
.screen { height: 190px; display: flex; align-items: center; justify-content: center; gap: 30px;
  background-color: #CFCAB2; background-image: linear-gradient(rgb(61 58 50 / 7%) 1px, transparent 1px), linear-gradient(90deg, rgb(61 58 50 / 7%) 1px, transparent 1px); background-size: 16px 16px; }
.screen b { font: 300 92px/1 'Plex', sans-serif; }
.screen svg { width: 140px; height: 140px; }
.body { padding: 14px 20px 18px; font: 500 24px 'Plex', sans-serif; display: flex; justify-content: space-between; align-items: center; }
.body span { font: 400 19px 'Plex Mono', monospace; color: #524F48; }
.c2 { top: 300px; right: 120px; width: 340px; }
.rows { padding: 6px 18px 12px; }
.row { display: grid; grid-template-columns: 6px 1fr auto; gap: 14px; align-items: center; padding: 10px 0; font: 500 20px 'Plex', sans-serif; }
.row + .row { border-top: 1px dashed #B5AF97; }
.row i { align-self: stretch; }
.row b { font: 400 18px 'Plex Mono', monospace; color: #883626; }
</style>
</head>
<body>
  <div class="words">
    <div class="mark"><img src="../public/icons/icon.svg" alt=""><span>taleeb-portal.pages.dev</span></div>
    <h1>بوابة معلومات الطالب</h1>
    <p>جدولك وغيابك ودرجاتك واختباراتك،<br>في بطاقاتٍ واضحة على جهازك.</p>
    <small>مشروعٌ طلابيٌّ مستقلّ · غير رسمي</small>
  </div>
  <div class="cards">
    <div class="card c1">
      <div class="bar"><span>الآن والتالي</span><i>01</i></div>
      <div class="screen">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="56" fill="none" stroke="#3D3A32" stroke-width="1.2"/>
          <g id="ticks"></g>
          <circle cx="60" cy="60" r="34" fill="none" stroke="#3D3A32" stroke-width=".8" stroke-dasharray="2 3"/>
          <path d="M60 26A34 34 0 1 1 30.6 77" fill="none" stroke="#D8A63C" stroke-width="7"/>
          <path d="M60 60L25.4 80" stroke="#3D3A32" stroke-width="2"/>
          <circle cx="60" cy="60" r="3.5" fill="#3D3A32"/>
        </svg>
        <b>1:10</b>
      </div>
      <div class="body"><span>Lab 3</span>Human Biology</div>
    </div>
    <div class="card c2">
      <div class="bar"><span>ما يحتاج انتباهك</span><i>05</i></div>
      <div class="rows">
        <div class="row"><i style="background:#4E6AA8"></i>Human Biology<b>21%</b></div>
        <div class="row"><i style="background:#5E8A4A"></i>Medical Terminology<b style="color:#524F48">9:00</b></div>
      </div>
    </div>
  </div>
<script>
  let t = '';
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30, l = i % 5 ? 4 : 9;
    t += `<line x1="${60 + 52 * Math.sin(a)}" y1="${60 - 52 * Math.cos(a)}" x2="${60 + (52 - l) * Math.sin(a)}" y2="${60 - (52 - l) * Math.cos(a)}" stroke="#3D3A32" stroke-width="${i % 5 ? .8 : 1.4}"/>`;
  }
  document.getElementById('ticks').innerHTML = t;
</script>
</body>
</html>
