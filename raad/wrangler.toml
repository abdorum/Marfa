# Raad's edge Worker. Every push to main deploys it (Workers Builds, root
# directory "raad"); by hand: npm run deploy:raad
name = "ties-raad"
main = "worker.ts"
compatibility_date = "2026-09-01"
# Only the site may call it, through the service binding.
workers_dev = false
preview_urls = false

# The college firewall refuses some countries (Docs/10). Running next to the
# college system's own region (Amsterdam) is both allowed and fastest.
[placement]
region = "azure:westeurope"

# Abuse protection (src/adapters/peoplesoft/edge/guard.ts).
# Wrong-password counters, keyed by a hash of the ID, kept 15 minutes.
[[kv_namespaces]]
binding = "GUARD"
id = "b2a0c22c36c5408db153ce90fccc4583"

# One device: 30 syncs a minute (a campus Wi-Fi is shared by many students).
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# One student ID: 6 syncs a minute.
[[ratelimits]]
name = "ID_LIMIT"
namespace_id = "1002"
simple = { limit = 6, period = 60 }
