# Raad's server (the Worker). Every push to main deploys it (Workers Builds,
# root directory "raad"); by hand: npm run deploy:raad
# The name predates the project's new name; Workers Builds is tied to it, and
# nobody sees it (the Worker has no public address).
name = "ties-raad"
main = "worker.ts"
compatibility_date = "2026-09-01"
# Variables set in the dashboard survive deploys: the owner pauses Raad
# (RAAD_PAUSED = 1, RAAD_MESSAGE_AR/EN) or posts an announcement (NOTICE_AR/EN)
# there, without touching code, beside the owner's page (/admin/), which sets
# the same switches (README: «لوحة المشرف، وإيقاف رعد والإعلان»).
keep_vars = true
# Only the site may call it, through the service binding.
workers_dev = false
preview_urls = false

# The college firewall refuses some countries (Docs/10). Running next to the
# college system's own region (Amsterdam) is both allowed and fastest.
[placement]
region = "azure:westeurope"

# Raad keeps no logs: no request, reply or error message is stored anywhere
# (Docs/09). Workers Logs stay off; `wrangler tail` shows only what the code
# prints, which is an error's kind, never its message.
[observability]
enabled = false

# /api/v1/status shows which deploy is running, so anyone the owner shows the
# code to can check it is the one serving students.
[version_metadata]
binding = "CF_VERSION_METADATA"

# The statistics devices send when their student opted in (ADR-014): codes and
# counts, never an ID or an address. Waits for Analytics Engine to be enabled on
# the account (Dashboard → Workers → Analytics Engine); until then they are
# simply not written. The server's own statistics are in STATS below.
# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "raad"

# Abuse protection (server/guard.ts). Every one of these must be bound: a
# missing one refuses every sync. The secret ID_KEY too (wrangler secret put ID_KEY).
# Wrong-password counters, keyed by an HMAC of the ID, kept 15 minutes; and Raad's rest.
[[kv_namespaces]]
binding = "GUARD"
id = "b2a0c22c36c5408db153ce90fccc4583"

# One address: 60 syncs a minute. A campus Wi-Fi puts many students behind
# one address; the per-ID limit below is what protects accounts.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# One student ID: 4 syncs a minute.
[[ratelimits]]
name = "ID_LIMIT"
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# Raad as a whole: 300 syncs a minute, so a morning rush cannot flood the college.
[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# The owner's statistics (server/stats.ts, ADR-040): a pseudonym per student
# who signed in with the first and last day, and counts per day that point to
# no one. Kept inside the European Union; the Worker makes its own tables.
[[d1_databases]]
binding = "STATS"
database_name = "taleeb-stats"
database_id = "46000ef0-635c-4d21-a988-81f85c3bd4e1"

# Every night at 03:00 in Jeddah: pseudonyms unused for a year, and counts two
# years old, are deleted (worker.ts: scheduled).
[triggers]
crons = ["0 0 * * *"]
